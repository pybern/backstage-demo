---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: express-rest-api
  title: Express REST API
  description: Scaffold a production-ready REST API with Express.js, OpenAPI docs, Docker support, and CI/CD pipelines.
  tags:
    - express
    - rest
    - typescript
    - docker
spec:
  owner: group:platform-engineering
  type: service
  parameters:
    - title: Service Details
      required:
        - name
        - port
      properties:
        name:
          title: Service Name
          type: string
          description: Name of the microservice
          ui:autofocus: true
        port:
          title: Port
          type: number
          description: Port the service will listen on
          default: 3000
        enableAuth:
          title: Enable Authentication
          type: boolean
          description: Include JWT auth middleware
          default: true
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
  output:
    links:
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['fetch-base'].output.entityRef }}
