apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: cron-job-scheduler
  title: Cron Job Scheduler
  description: Create a Kubernetes CronJob with configurable schedule, retry policies, alerting, and Slack notifications on failure.
  tags:
    - kubernetes
    - cron
    - scheduling
    - python
spec:
  owner: group:platform-engineering
  type: cron
  parameters:
    - title: Job Configuration
      required:
        - name
        - schedule
      properties:
        name:
          title: Job Name
          type: string
          description: Name of the cron job
          ui:autofocus: true
        schedule:
          title: Cron Schedule
          type: string
          description: 'Cron expression (e.g. 0 */6 * * *)'
          default: '0 0 * * *'
        retryLimit:
          title: Retry Limit
          type: number
          description: Number of retries on failure
          default: 3
        notifyOnFailure:
          title: Notify Slack on Failure
          type: boolean
          default: true
    - title: Choose a location
